# Build, test and scan the patient dashboard.
#
# The filename says docker-publish because that is what this workflow used to be; it builds and tests
# the Angular app and publishes nothing. Renaming it would break whatever branch protection or badge
# references it by path, so it keeps the name.
name: Build and Test Patient Dashboard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 20.19, not bare '20'. Angular 20 requires ^20.19.0 || ^22.12.0 || >=24.0.0, and a bare
          # major would silently satisfy that only for as long as setup-node's latest 20.x happens
          # to be >= 20.19 — which was already true, so the failure this prevents is the confusing
          # kind that appears months later with no related change.
          node-version: '20.19'
          cache: 'npm'

      # `npm ci`, not `npm install`. install ignores the lockfile when package.json allows a newer
      # match, so CI could silently resolve different transitive versions than a developer's machine
      # — which also means an audit run against one says nothing reliable about the other. ci fails
      # outright when the two files disagree, which is the behaviour worth having.
      #
      # --legacy-peer-deps stays, but the reason changed with the Angular 20 upgrade: it is no longer
      # Angular. The one remaining conflict is browser-sync-webpack-plugin@2.3.0, which peers on
      # browser-sync ^2 while this repo (and @angular-devkit/build-angular) use 3.x. It is a
      # dev-server-only plugin, so the mismatch never reaches a build artefact. Dropping the flag
      # needs that plugin replaced or removed.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run webapp:prod

      - name: Run unit tests
        run: npx ng test --coverage=false

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 20.19, not bare '20'. Angular 20 requires ^20.19.0 || ^22.12.0 || >=24.0.0, and a bare
          # major would silently satisfy that only for as long as setup-node's latest 20.x happens
          # to be >= 20.19 — which was already true, so the failure this prevents is the confusing
          # kind that appears months later with no related change.
          node-version: '20.19'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # --omit=dev on purpose: the toolchain accounts for most of this repo's advisory count and is
      # not reachable by anyone who does not already control the build. What ships to a browser is
      # what matters here.
      #
      # BLOCKING, as of 2026-08-05. The Angular i18n/SVG XSS advisories are gone with the 20.3.27
      # upgrade, and the last critical — websocket-driver, reached only through sockjs-client — went
      # with the chatbot widget that no backend implemented. Runtime is now zero critical, zero high.
      #
      # It stays passable only if it stays true, which is the point of gating rather than reporting.
      # If this fails, the fix is the dependency, not this line.
      #
      # --audit-level=high deliberately tolerates the 12 remaining moderates, all of them one
      # @opentelemetry/core advisory fanning out across the browser SDK. Clearing it means an OTel
      # 1.x -> 2.x migration; that telemetry code has already taken the SPA down once, so it gets
      # planned rather than rushed through a gate.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # The full picture, always recorded, never gating — so the trend is visible even while the
      # gate above is off.
      - name: Full audit report
        if: always()
        continue-on-error: true
        run: npm audit --json > npm-audit.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json
          retention-days: 7
          if-no-files-found: ignore
