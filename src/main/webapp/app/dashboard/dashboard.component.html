@if (account) {
<p>dashboard works!</p>
<div class="row d-flex justify-content-center">
    <div class="col-md-10">
        <div class="alert alert-success">
            <span id="home-logged-message" jhiTranslate="home.logged.message"
                [translateValues]="{ username: account.login }">You
                are logged in as user &quot;{{ account.login
                }}&quot;.</span>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-md-2 p-0 d-flex justify-content-center">
        <div class="border border-secondary round-border">
            <div class="profile-button">
                <button class="btn btn-primary btn-small">
                    <fa-icon icon="camera"></fa-icon>
                </button>
            </div>
            @if (account.imageUrl) {
            <img [src]="account.imageUrl" alt="profile image">
            } @else {
            <span class="profile-placeholder img-fluid rounded p-1">
            </span>
            }
        </div>
    </div>
    <div class="col-md-10 border border-secondary round-border">
        <p>{{account.firstName}} {{account.lastName}}</p>
    </div>
</div>
<div class="row mt-1 pt-1">
    <nav class="navbar navbar-expand-lg bg-white">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Dropdown
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="#">Action</a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#">Another action</a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item" href="#">Something else here</a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
</div>
}
