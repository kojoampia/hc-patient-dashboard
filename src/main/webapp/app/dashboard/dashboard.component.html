@if (account) {
<div class="row">
    <div class="col-md-2 round-border dashboard-component-left">
        <div class="ml-auto mr-auto">
            <div class="profile-button m-0 p-0">
                <button class="btn btn-primary btn-small">
                    <fa-icon icon="camera"></fa-icon>
                </button>
            </div>
            @if (account.imageUrl) {
            <img [src]="account.imageUrl" alt="profile image">
            } @else {
            <span class="profile-placeholder img-fluid rounded p-1">
            </span>
            }
        </div>
    </div>
    <div class="col-md-10 round-border dashboard-component-right">
        <div class="row d-flex justify-content-end">
            <div class="col-md-*">
                <span>{{account.firstName}} {{account.lastName}}</span>
            </div>
        </div>
        <div class="row">
            <div class="col-md-*">
                <span>{{phoneNumber}}</span>
            </div>
        </div>
        <div class="row">
            <div class="col-md-*">
                <span>{{account.email}}</span>
            </div>
        </div>
        <div class="row">
            <div class="col-md-*">
                <span>{{membership}}</span>
            </div>
        </div>
    </div>
</div>
<div class="row d-flex justify-content-end mt-2">
    <div class="col-md-12 border border-primary round-border dashboard-component-center">
        <nav class="navbar navbar-expand-lg navbar-primary">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="#">Status</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="#">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="#">Address</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="#">Membership</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="#">Report</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="#">Medications</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>
</div>
}
