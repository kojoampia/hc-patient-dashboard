@if (professional) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(professional.id!)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="professionalDeleteDialogHeading" hpdTranslate="entity.delete.title">Confirm delete operation</h4>

      <button type="button" class="btn-close" data-dismiss="modal" aria-hidden="true" (click)="cancel()">&times;</button>
    </div>

    <div class="modal-body">
      <hpd-alert-error></hpd-alert-error>
      <p
        id="hpd-delete-professional-heading"
        hpdTranslate="patientDashboardApp.patientMsProfessional.delete.question"
        [translateValues]="{ id: professional.id }"
      >
        Are you sure you want to delete Professional {{ professional.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
        <fa-icon icon="ban"></fa-icon>&nbsp;<span hpdTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="hpd-confirm-delete-professional" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times"></fa-icon>&nbsp;<span hpdTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
