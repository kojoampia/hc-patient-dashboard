<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (stat) {
      <div>
        <h2 data-cy="statDetailsHeading"><span hpdTranslate="patientDashboardApp.patientMsStat.detail.title">Stat</span></h2>

        <hr />

        <hpd-alert-error></hpd-alert-error>

        <hpd-alert></hpd-alert>

        <dl class="row-md jh-entity-details">
          <dt><span hpdTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ stat.id }}</span>
          </dd>
          <dt><span hpdTranslate="patientDashboardApp.patientMsStat.name">Name</span></dt>
          <dd>
            <span>{{ stat.name }}</span>
          </dd>
          <dt><span hpdTranslate="patientDashboardApp.patientMsStat.description">Description</span></dt>
          <dd>
            <span>{{ stat.description }}</span>
          </dd>
          <dt><span hpdTranslate="patientDashboardApp.patientMsStat.value">Value</span></dt>
          <dd>
            <span>{{ stat.value }}</span>
          </dd>
          <dt><span hpdTranslate="patientDashboardApp.patientMsStat.note">Note</span></dt>
          <dd>
            <span>{{ stat.note }}</span>
          </dd>
          <dt><span hpdTranslate="patientDashboardApp.patientMsStat.createdDate">Created Date</span></dt>
          <dd>
            <span>{{ stat.createdDate | formatMediumDate }}</span>
          </dd>
          <dt><span hpdTranslate="patientDashboardApp.patientMsStat.createdBy">Created By</span></dt>
          <dd>
            <span>{{ stat.createdBy }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span hpdTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/stat', stat.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span hpdTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
