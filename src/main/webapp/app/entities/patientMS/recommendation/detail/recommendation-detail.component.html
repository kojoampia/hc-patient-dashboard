<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (recommendation) {
      <div>
        <h2 data-cy="recommendationDetailsHeading">
          <span hpdTranslate="patientDashboardApp.patientMsRecommendation.detail.title">Recommendation</span>
        </h2>

        <hr />

        <hpd-alert-error></hpd-alert-error>

        <hpd-alert></hpd-alert>

        <dl class="row-md jh-entity-details">
          <dt><span hpdTranslate="patientDashboardApp.patientMsRecommendation.id">Id</span></dt>
          <dd>
            <span>{{ recommendation.id }}</span>
          </dd>
          <dt><span hpdTranslate="patientDashboardApp.patientMsRecommendation.label">Label</span></dt>
          <dd>
            <span>{{ recommendation.label }}</span>
          </dd>
          <dt><span hpdTranslate="patientDashboardApp.patientMsRecommendation.category">Category</span></dt>
          <dd>
            <span>{{ recommendation.category }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span hpdTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/recommendation', recommendation.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span hpdTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
