<h2 class="hc-auth-title" hpdTranslate="login.title" data-cy="loginTitle">Sign in</h2>
<p class="hc-muted hc-auth-lede" hpdTranslate="patientPortal.auth.signInLede">Access your personal health record.</p>

@if (authenticationError) {
  <div class="hc-auth-error" role="alert" hpdTranslate="login.messages.error.authentication" data-cy="loginError">
    <strong>Failed to sign in!</strong> Please check your credentials and try again.
  </div>
}

<form class="form" role="form" (ngSubmit)="login()" [formGroup]="loginForm">
  <div class="hc-field">
    <label class="username-label" for="username" hpdTranslate="global.form.username.label">Username</label>
    <input
      type="text"
      name="username"
      id="username"
      autocomplete="username"
      placeholder="{{ 'global.form.username.placeholder' | translate }}"
      formControlName="username"
      #username
      data-cy="username"
    />
  </div>

  <div class="hc-field">
    <label for="password" hpdTranslate="login.form.password">Password</label>
    <input
      type="password"
      name="password"
      id="password"
      autocomplete="current-password"
      placeholder="{{ 'login.form.password.placeholder' | translate }}"
      formControlName="password"
      data-cy="password"
    />
  </div>

  <label class="hc-auth-remember">
    <input type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
    <span hpdTranslate="login.form.rememberme">Remember me</span>
  </label>

  <button type="submit" class="hc-btn hc-btn--primary hc-btn--block" hpdTranslate="login.form.button" data-cy="submit">Sign in</button>
</form>

<div class="hc-auth-sep"><span hpdTranslate="patientPortal.auth.or">or</span></div>

<a class="hc-btn hc-btn--ghost hc-btn--block" routerLink="/account/register" hpdTranslate="global.messages.info.register.link">
  Register a new account
</a>

<p class="hc-auth-foot">
  <a routerLink="/account/reset/request" hpdTranslate="login.password.forgot" data-cy="forgetYourPasswordSelector">
    Did you forget your password?
  </a>
</p>
