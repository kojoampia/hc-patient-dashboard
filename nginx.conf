# Serves the built dashboard and forwards every API call to the gateway.
#
# This container is the only one in the patient stack that publishes a port: patient.abofonsa.com is
# the subsystem's single external URL, and the gateway and microservice stay on the internal Docker
# network. So the fan-out to the backend happens here rather than in the host nginx, and the browser
# only ever sees one origin — which is also why the bundle is built same-origin (see
# webpack/webpack.custom.js) and the gateway needs no CORS configuration.
#
# The gateway routes onward to the microservice as /services/hcpatientservice/**, discovering it
# through Consul. Nothing here needs to know the microservice exists.

server {
  listen 80;
  sendfile on;
  default_type application/octet-stream;

  # Docker's embedded DNS. Needed because the proxy_pass directives below go through a variable: with
  # a literal name nginx resolves upstreams once at startup and refuses to start with "host not found
  # in upstream" whenever the gateway container is not up yet — which, on a cold `docker compose up`,
  # is most of the time. With a variable plus this resolver, resolution happens per request, so the
  # dashboard serves its shell while the backend is still booting.
  resolver 127.0.0.11 valid=10s ipv6=off;
  # The container's full name, not the short compose service name `gateway`: the backend containers
  # also join a shared external `monitoring` network where other projects publish their own `gateway`
  # alias, and the short name is not guaranteed to resolve to ours.
  set $gateway "http://hc-patient-gateway:5503";

  gzip on;
  gzip_http_version 1.1;
  gzip_disable      "MSIE [1-6]\.";
  gzip_min_length   256;
  gzip_vary         on;
  gzip_proxied      expired no-cache no-store private auth;
  gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_comp_level   9;

  root /usr/share/nginx/html;

  # Authentication, account management, and everything the JHipster client calls directly.
  location /api/ {
    proxy_pass                          $gateway$request_uri;
    proxy_http_version                  1.1;
    proxy_set_header  Host              $http_host;
    proxy_set_header  X-Real-IP         $remote_addr;
    proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    # $scheme is http inside this container; the host nginx terminates TLS, so forward what the
    # browser actually used or the gateway builds http:// links into activation emails.
    proxy_set_header  X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout                  60s;
  }

  # Microservice traffic: ApplicationConfigService.getEndpointFor(api, 'hcpatientservice') builds
  # these, and the gateway rewrites /services/<id>/** to /** on the target service.
  location /services/ {
    proxy_pass                          $gateway$request_uri;
    proxy_http_version                  1.1;
    proxy_set_header  Host              $http_host;
    proxy_set_header  X-Real-IP         $remote_addr;
    proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout                  60s;
  }

  # The admin screens read gateway routes and per-service health from here. The gateway requires
  # ROLE_ADMIN on everything under /management except health and info, so proxying it does not hand
  # out metrics — it does make the admin UI work.
  location /management/ {
    proxy_pass                          $gateway$request_uri;
    proxy_http_version                  1.1;
    proxy_set_header  Host              $http_host;
    proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # OpenAPI, admin-only at the gateway. Proxied so the admin API-docs screen is not a 404.
  location /v3/api-docs {
    proxy_pass                          $gateway$request_uri;
    proxy_http_version                  1.1;
    proxy_set_header  Host              $http_host;
    proxy_set_header  X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Hashed bundle filenames are immutable. index.html deliberately is not cached, so a deploy shows
  # up on the next request rather than after a browser cache expiry.
  location ~* \.(?:js|css|woff2?|svg|ico|png|jpe?g|gif)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html =404;
    add_header Cache-Control "no-cache";
  }
}
