name: health-connect
services:
  patientdashboard:
    image: hc-patient-dashboard:0.0.1
    container_name: hc-patient-dashboard
    hostname: hc-patient-dashboard
    build:
      context: .
      dockerfile: Dockerfile.dev
      tags:
        - 'hc-patient-dashboard:0.0.1'
        - 'hc-patient-dashboard:latest'
    environment:
      - SERVER_API_URL=http://localhost:5501/
    volumes:
      - './patientdashboard:/usr/src/app'
    ports:
      - 127.0.0.1:5500:80
    networks:
      - devnet

networks:
  devnet:
    external: true
    name: devnet
