version: '3.5'
services:
  hc-dev-patient-dashboard:
    image: hc-patient-dashboard
    container_name: hc-patient-dashboard
    build:
      context: .
      dockerfile: Dockerfile.prod
    volumes:
      - './hc-patient-dashboard:/usr/src/app'
    ports:
      - 127.0.0.1:4200:80
    networks:
      - hcnet

networks:
  devnet:
    external:
      name: hcnet
