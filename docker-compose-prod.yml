name: health-connect
services:
  hc-patient-dashboard:
    image: hc-patient-web:0.0.1
    container_name: hc-patient-dashboard
    hostname: hc-patient-dashboard
    build:
      context: .
      dockerfile: Dockerfile.prod
      tags:
        - "docker.jojoaddison.net/hc-patient-web:0.0.1"
        - "docker.jojoaddison.net/hc-patient-web:latest"
    ports:
      - 127.0.0.1:5500:80
    networks:
      - hcnet

networks:
  # Key must match the name the service references; it was `devnet` while the service asked for
  # `hcnet`, which made this file fail to load at all ("refers to undefined network hcnet").
  hcnet:
    external: true
    name: hcnet
